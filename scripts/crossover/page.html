</head><body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

// Shared by the offline renderer (render.mjs) and, in spirit, by the app's live viewer.
// SWGOH: unlit dual matcap (mask.R picks the shiny matcap), which is what its shader keywords say.
// MSF: lit standard material with the DXT5nm normal map decoded in the shader.
// MEASURED 2026-09-23 across all 68 SWGOH bundles: 282 of the 298 matcap slots point at a texture in a
// SHARED bundle the corpus does not include, and every single character has at least one. Only 7 carry
// any matcap of their own. A MeshMatcapMaterial with `matcap: null` does not skip the lookup -- three.js
// compiles its fallback branch, `vec4 matcapColor = vec4( vec3( mix( 0.2, 0.8, uv.y ) ), 1.0 )`, a plain
// grey ramp down the view-space normal. That is what made every Star Wars character look flat and
// washed next to the lit Marvel ones: they were being shaded by a gradient, not by a material.
// FALLBACK is the game's own art, not an invention: `matcap_metal_glossy_b_tex` (a chrome sphere) and
// `matcap_plastic_less_gloss_tex` (a soft one) are both IN the corpus, in other characters' bundles,
// and they are the pair this shader is built around -- the mask's red channel picks the shiny one for
// metal and the soft one for everything else, which is exactly what the 62 in-bundle masks encode.
function swgohMaterial(src, extras, tex, fallback) {
  const m = new THREE.MeshMatcapMaterial({map: src.map, matcap: extras._MatCap ? tex(extras._MatCap.index) : fallback.glossy});
  const matB = extras._MatCapB ? tex(extras._MatCapB.index) : (extras._MatCap ? m.matcap : fallback.soft);
  const mask = extras._Mask ? tex(extras._Mask.index) : null;
  const f = extras.floats || {};
  m.onBeforeCompile = (sh) => {
    sh.uniforms.matcapB = {value: matB};
    sh.uniforms.maskMap = {value: mask};
    sh.uniforms.hasMask = {value: mask ? 1 : 0};
    sh.uniforms.brightA = {value: f._Brightness ?? 1};
    sh.uniforms.brightB = {value: f._BrightnessB ?? 1};
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform sampler2D matcapB; uniform sampler2D maskMap; uniform float hasMask; uniform float brightA; uniform float brightB;')
      .replace('vec4 matcapColor = texture2D( matcap, uv );',
        `vec4 matcapA = texture2D( matcap, uv ); vec4 matcapBc = texture2D( matcapB, uv );
         float sel = hasMask > 0.5 ? texture2D( maskMap, vMapUv ).r : 1.0;
         vec4 matcapColor = mix( matcapBc * brightB, matcapA * brightA, sel ) * 2.0;`);
  };
  m.userData.custom = 'swgoh-matcap';
  return m;
}

function msfMaterial(src, extras, tex) {
  const m = new THREE.MeshStandardMaterial({map: src.map, roughness: 0.62, metalness: 0.0});
  if (extras._BumpMap) {
    m.normalMap = tex(extras._BumpMap.index);
    m.normalMap.colorSpace = THREE.NoColorSpace;
    m.onBeforeCompile = (sh) => {
      // Unity DXT5nm: x in alpha, y in green, z reconstructed.
      sh.fragmentShader = sh.fragmentShader.replace('#include <normal_fragment_maps>',
        `vec4 nraw = texture2D( normalMap, vNormalMapUv );
         vec3 mapN; mapN.xy = vec2(nraw.a, nraw.g) * 2.0 - 1.0; mapN.z = sqrt(max(0.0, 1.0 - dot(mapN.xy, mapN.xy)));
         mapN.xy *= normalScale;
         normal = normalize( tbn * mapN );`);
    };
  }
  m.userData.custom = 'msf-standard';
  return m;
}

window.setup = async (opts) => {
  const W = opts.width, H = opts.height;
  const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const gltf = await new GLTFLoader().loadAsync(opts.glb);
  const model = gltf.scene;
  const texCache = new Map();
  const parser = gltf.parser;
  const texList = await Promise.all((parser.json.textures || []).map((_, i) => parser.getDependency('texture', i)));
  const tex = (i) => { const t = texList[i]; t.flipY = false; return t; };
  // The two shared matcaps, loaded once. flipY is false to match every texture that comes out of the
  // GLB, so the highlight sits where the character's own matcap would have put it.
  // AWAITED, not fired off: a matcap that has not arrived yet samples as black, and the shader
  // multiplies the base texture by it, so the first frame renders the character as a silhouette.
  const loader = new THREE.TextureLoader();
  const sphere = async (file) => { const t = await loader.loadAsync(file); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; return t; };
  const [glossy, soft] = await Promise.all([sphere('./matcap_metal_glossy_b_tex.png'), sphere('./matcap_plastic_less_gloss_tex.png')]);
  const fallback = {glossy, soft};
  // These textures are 256x256 and the render is 1280x1920, so every one of them is magnified.
  // Anisotropic filtering is what keeps a surface at an angle -- a pauldron, a boot, a floor-facing
  // plate -- from smearing, and it costs nothing at this resolution.
  const aniso = renderer.capabilities.getMaxAnisotropy();
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    const ex = o.material.userData || {};
    const extras = ex;
    if (opts.style === 'swgoh') o.material = swgohMaterial(o.material, extras, tex, fallback);
    else o.material = msfMaterial(o.material, extras, tex);
    if (o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace;
    if (o.material.matcap) o.material.matcap.colorSpace = THREE.SRGBColorSpace;
    for (const slot of ['map', 'normalMap', 'matcap']) if (o.material[slot]) o.material[slot].anisotropy = aniso;
  });
  // SWGOH sabers are particle VFX in Unity. The GLB keeps their empty transforms, so a node named
  // like vfx_swd_saber_chld_<colour> gets a simple emissive blade along its local -Y, starting at the hilt's emitter end (checked against the hilt in the render). The blade
  // length comes from its 'Tron Trail' child when present (Vader: 1.122 m), else 1.0.
  if (opts.sabers !== false) {
    // MEASURED over all 68 SWGOH bundles (2026-09-23): 35 characters carry a saber emitter, and the
    // node is spelled BOTH ways -- `saber_chld_` on 18 and `saber_chd_` on 23. Matching only `chld`
    // found 15 of the 35, so 20 characters rendered a bare hilt and no blade: Jedi Knight Luke, Jedi
    // Master Kenobi, Anakin, Yoda, Rey, Ben Solo, Ahsoka among them. Vader is a `chld`, which is why
    // the feature looked finished when it was written on him.
    // The colour tokens the corpus uses are red 18, blue 15, green 12, prpl 5, white 2, black 1 and
    // `pre` 1 -- `prpl` and `black` were in no map, so those six fell through to the default and
    // rendered RED. The two Darksabers are named differently from every other blade and from each
    // other: Sabine Wren (S3) carries `vfx_swd_saber_chd_black_pre`, but Bo-Katan's is
    // `vfx_dark_saber_chd_pre`, whose colour token is the literal "pre". Both are matched by name.
    const colours = {red: 0xff2a1a, blue: 0x2a7bff, green: 0x3dff5a, purple: 0xb04dff, prpl: 0xb04dff,
                     yellow: 0xffd23a, white: 0xf4f4ff, orange: 0xff8a1a, cyan: 0x3de8ff, black: 0x14141a};
    const found = [];
    model.traverse((o) => {
      const m = /saber_chl?d_([a-z]+)/i.exec(o.name);
      if (!m || /trail|glow/i.test(o.name)) return;
      found.push([o, /dark_saber|black_saber/i.test(o.name) ? 'black' : m[1].toLowerCase()]);
    });
    for (const [node, colourName] of found) {
      const colour = colours[colourName] ?? colours.red;
      // The Darksaber inverts an ordinary blade: a black blade with a bright white edge, rather than a
      // white core inside a coloured glow. Built from the same three cylinders, with core and rim swapped.
      const dark = colourName === 'black';
      let length = 1.0;
      node.traverse((c) => { if (/tron trail/i.test(c.name)) length = Math.abs(c.position.y) || length; });
      const blade = new THREE.Group();
      // Blade starts at the emitter end of the hilt mesh (its most negative local Y), not at the pommel.
      let start = 0;
      if (node.parent && node.parent.isMesh) { node.parent.geometry.computeBoundingBox(); start = Math.min(0, node.parent.geometry.boundingBox.min.y - node.position.y); }
      // These are concentric cylinders, so what is drawn LAST is what the viewer sees in the middle.
      // An ordinary blade wants the white core on top of its colour; the Darksaber wants the opposite,
      // a black body drawn over a white halo, which leaves the bright edge showing around it.
      // The dark core must join the TRANSPARENT pass, or renderOrder cannot help it: three.js draws
      // every opaque mesh before any transparent one, so an opaque black core is laid down first and
      // the additive white halo then brightens it to white -- which is what happened to Bo-Katan's
      // Darksaber on the first attempt. transparent with opacity 1 keeps it solid and late.
      const core = new THREE.Mesh(new THREE.CylinderGeometry(dark ? 0.028 : 0.011, dark ? 0.03 : 0.013, length, 16, 1),
        new THREE.MeshBasicMaterial(dark ? {color: colour, transparent: true, opacity: 1, depthWrite: false} : {color: 0xffffff}));
      const glow1 = new THREE.Mesh(new THREE.CylinderGeometry(dark ? 0.038 : 0.026, dark ? 0.04 : 0.03, length * 1.01, 16, 1),
        new THREE.MeshBasicMaterial({color: dark ? 0xe8ecff : colour, transparent: true, opacity: dark ? 0.75 : 0.85, blending: THREE.AdditiveBlending, depthWrite: false}));
      const glow2 = new THREE.Mesh(new THREE.CylinderGeometry(dark ? 0.052 : 0.055, dark ? 0.054 : 0.06, length * 1.03, 16, 1),
        new THREE.MeshBasicMaterial({color: dark ? 0xb9c4ff : colour, transparent: true, opacity: dark ? 0.22 : 0.28, blending: THREE.AdditiveBlending, depthWrite: false}));
      for (const b of [glow2, glow1, core]) { b.position.y = start - length / 2; b.userData.noBounds = true; b.frustumCulled = false; blade.add(b); }
      if (dark) { glow2.renderOrder = 2; glow1.renderOrder = 3; core.renderOrder = 4; }
      else { core.renderOrder = 2; glow1.renderOrder = 3; glow2.renderOrder = 4; }
      node.add(blade);
    }
    window.__sabers = found.map(([n, c]) => n.name + ':' + c);
  }
  model.rotation.y = (opts.yaw || 0) * Math.PI / 180;
  scene.add(model);
  // Lights (only the MSF standard material uses them).
  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3140, 1.35));
  const key = new THREE.DirectionalLight(0xfff4e6, 2.4); key.position.set(-2.2, 3.2, 3.5); scene.add(key);
  const rim = new THREE.DirectionalLight(0xcfe0ff, 1.6); rim.position.set(2.5, 2.0, -2.5); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(2.0, 0.5, 3.0); scene.add(fill);

  const mixer = new THREE.AnimationMixer(model);
  const clip = gltf.animations[0];
  let action = null;
  if (clip) { action = mixer.clipAction(clip); action.play(); }
  const duration = clip ? clip.duration : 0;
  const pose = (t) => { if (action) { mixer.setTime(t); } model.updateMatrixWorld(true); };

  // Bounds over the whole loop, from skinned vertex positions.
  const box = new THREE.Box3();
  const v = new THREE.Vector3();
  const samples = clip ? 12 : 1;
  for (let s = 0; s < samples; s++) {
    pose(duration * s / samples);
    model.traverse((o) => {
      if (!o.isMesh || o.userData.noBounds) return;
      const p = o.geometry.attributes.position;
      const step = Math.max(1, Math.floor(p.count / 1500));
      for (let i = 0; i < p.count; i += step) {
        v.fromBufferAttribute(p, i);
        if (o.isSkinnedMesh) o.applyBoneTransform(i, v);
        v.applyMatrix4(o.matrixWorld);
        box.expandByPoint(v);
      }
    });
  }
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  // Frame like the Isekai stills: full body, head near 12% from the top, feet near 88%.
  const fov = opts.fov || 18;
  const camera = new THREE.PerspectiveCamera(fov, W / H, 0.05, 200);
  const targetFrac = opts.heightFraction || 0.74;
  // Fit height (full body) and width (wide characters such as Hulk or R2-D2 would otherwise be cropped).
  const visibleH = Math.max(size.y / targetFrac, size.x / ((W / H) * (opts.widthFraction || 0.9)));
  const dist = (visibleH / 2) / Math.tan(THREE.MathUtils.degToRad(fov / 2));
  const lookY = center.y + (opts.verticalOffset || 0) * visibleH;
  const elev = THREE.MathUtils.degToRad(opts.elevation || 4);
  camera.position.set(center.x, lookY + Math.sin(elev) * dist, center.z + Math.cos(elev) * dist);
  camera.lookAt(center.x, lookY, center.z);
  window.__state = {renderer, scene, camera, pose, duration, bounds: {min: box.min.toArray(), max: box.max.toArray()}};
  return {duration, bounds: window.__state.bounds, clip: clip ? clip.name : null, tracks: clip ? clip.tracks.length : 0};
};

window.frame = (t) => {
  const s = window.__state;
  s.pose(t);
  s.renderer.render(s.scene, s.camera);
  return s.renderer.domElement.toDataURL('image/png');
};
window.__ready = true;
</script>
</body></html>
