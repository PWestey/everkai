name: Materialize verified source delivery
on:
  push:
    paths:
      - '.delivery/**'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source
        run: |
          cat .delivery/part-* > /tmp/everkai-source.tar.gz
          echo '0c3b8d7467c7dcae0eb04818c2e451022f8fbe4faea8e4f23501ebf0c6f82d0c  /tmp/everkai-source.tar.gz' | sha256sum --check
          tar -xzf /tmp/everkai-source.tar.gz
          rm -r .delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Materialize reviewed playable source 4a758661 and required assets'
          git push origin HEAD:main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: everkai-static-site
          path: dist/client
          if-no-files-found: error
